
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookora Library</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #f8f5ff;
      color: #302747;
    }

    header {
      background: #7354a5;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    main {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px #ddd4ed;
    }

    .welcome h2 {
      margin-bottom: 12px;
    }

    .library {
      margin-top: 35px;
    }

    .library h2 {
      margin-bottom: 15px;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #756b85;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 Bookora Library</h1>
    <p>Every book has a home.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Bookora!</h2>
      <p>Your personal space to discover, organise and enjoy books.</p>
    </section>

    <section class="library">
      <h2>My Library</h2>
      <div class="empty">
        <p>📖 Your bookshelf is waiting for its first book!</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ for book lovers.</p>
  </footer>

</body>
</html>
